name: voiceai-dev

services:
  postgres:
    # pgvector-enabled Postgres 16 — same image family we can run in staging,
    # and the vector extension is required for Phase 2 (RAG embeddings).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voiceai
      POSTGRES_PASSWORD: voiceai_dev
      POSTGRES_DB: voiceai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceai -d voiceai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
